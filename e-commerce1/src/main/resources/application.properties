# --- CONFIGURACIÓN MYSQL ---
# DB_HOST=localhost (default, XAMPP) o "mysql" (Docker, seteado por docker-compose)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/ecommerce1?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
# DB_PASSWORD vacío por defecto (XAMPP sin contraseña), "root" en Docker
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

# Dialecto corregido para Hibernate 7+
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect

# Estrategia de tablas
# DDL_AUTO=update por defecto: crea tablas si no existen (necesario en Docker fresh start)
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=true


# --- CARGA INICIAL ---
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
# Ruta física donde se guardarán las fotos de los productos
app.upload.dir=./imagenes/

# Límites de tamaño para la subida de archivos (Fotos de alta calidad)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


# --- DESACTIVACIÓN DE H2 
spring.h2.console.enabled=false